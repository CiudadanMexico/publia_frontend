<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Publia — El mundo está cambiando">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#14101f" />
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b48bff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0.5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.9">
    <polygon points="980,90 1110,160 1060,330 900,330 850,160" fill="url(#prism)" />
    <polygon points="980,90 1110,160 980,220" fill="#ffffff" opacity="0.22" />
  </g>
  <text x="80" y="270" fill="#f4f3f7" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="86" font-weight="700" letter-spacing="2">EL MUNDO ESTÁ CAMBIANDO.</text>
  <text x="80" y="350" fill="#9c9cb0" font-family="Inter, Segoe UI, sans-serif" font-size="40">Tu negocio también puede cambiar las reglas.</text>
  <text x="80" y="520" fill="#b48bff" font-family="IBM Plex Mono, monospace" font-size="26" letter-spacing="6">PUBLIA · RED COOPERATIVA DE DESARROLLO</text>
</svg>
